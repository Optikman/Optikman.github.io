<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥷 قفزة المفاتيح (اللغة العربية)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0f2027;
            --bg-mid: #203a43;
            --bg-bot: #2c5364;
            --platform: #11998e;
            --primary: #38ef7d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; background: linear-gradient(to bottom, var(--bg-top), var(--bg-mid), var(--bg-bot));
            font-family: 'Cairo', sans-serif; color: white;
        }

        #game-board {
            position: relative; width: 400px; height: 600px; 
            background-color: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
            border-radius: 20px; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden;
        }

        .hud {
            position: absolute; top: 15px; left: 15px; z-index: 10; font-size: 24px; font-weight: 700; color: #fff;
            text-shadow: 1px 1px 2px #000; display: flex; align-items: center; gap: 10px;
        }
        .instructions {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            font-size: 13px; color: rgba(255,255,255,0.5); pointer-events: none; z-index: 5;
        }

        /* 🥷 شخصية اللاعب */
        #player {
            position: absolute; width: 40px; height: 40px; 
            font-size: 32px; text-align: center; line-height: 40px;
            filter: drop-shadow(0 0 5px rgba(56, 239, 125, 0.6));
            will-change: transform; z-index: 20;
        }

        /* المنصات والكلمات */
        .platform {
            position: absolute; width: 110px; height: 20px; 
            background: linear-gradient(to bottom, var(--platform), var(--primary)); 
            border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 10;
            will-change: transform;
        }

        .word-display {
            position: absolute; top: -35px; width: 100%; text-align: center; 
            font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 2px 10px;
            border-radius: 6px; letter-spacing: 1px; color: white; white-space: nowrap; direction: rtl;
        }

        .typed {
            color: #ff3366 !important; /* اللون للتدليل على نجاح الحروف */
            text-shadow: 0 0 5px rgba(255, 51, 102, 0.8);
            font-weight: bold;
        }

        /* شاشات البدء والرسوب */
        .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 100;
        }

        .overlay h1 { font-size: 36px; margin-bottom: 10px; background: -webkit-linear-gradient(right, #38ef7d, #11998e); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .overlay p { font-size: 18px; margin-bottom: 30px; line-height: 1.5; color: #ddd; max-width: 80%;}
        
        button {
            padding: 12px 30px; font-size: 22px; font-weight: bold; font-family: 'Cairo', sans-serif; cursor: pointer;
            background: linear-gradient(to left, var(--platform), var(--primary));
            border: none; border-radius: 10px; color: #111; text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4); transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(56, 239, 125, 0.6); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-board">
    <!-- UI Area -->
    <div class="hud" id="hud">⭐ <span id="scoreText">0</span></div>
    <div class="instructions">ملاحظة: اضغط Backspace أو ESC إذا أخطأت لإلغاء القفل 🔴<br>يرجى تحويل لغة كيبورد الجهاز إلى اللغة العربية أولاً.</div>
    
    <!-- Player Object -->
    <div id="player" class="hidden">🥷</div>

    <!-- Menus -->
    <div id="startScreen" class="overlay">
        <h1>قفزة المفاتيح (عربي)</h1>
        <p>اقفز بالنینجا عبر كتابة الكلمات باللغة العربية. إذا واجهت منصات طويلة ولم تُسرع، فسوف يسقط النینجا!</p>
        <button onclick="startGame()">▶ بدء اللعب</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="background: -webkit-linear-gradient(right, #ff3366, #ff9933); -webkit-text-fill-color: transparent; -webkit-background-clip: text;">سقط النينجا!</h1>
        <p style="font-size:24px;">نقاطك: <span id="finalScore" style="color:white; font-weight:bold">0</span></p>
        <button onclick="startGame()">🔄 العب مجدداً</button>
    </div>
</div>

<script>
/* ==================== 📚 القاموس ==================== */
// قواميس مخصصة، مصنفة حسب مستويات تزداد تدريجياً لضمان تصاعد متعة التحدي 
const dictionary = {
    lvl1: ["ام", "هو", "لو", "هم", "اب", "لم", "اخ", "هل", "بحر", "لا", "بنا", "حب", "حق"],
    lvl2: ["قلم", "ورد", "سيف", "نهر", "بحر", "عمل", "عرب", "موز", "تمر", "كوب", "سحب", "سهم"],
    lvl3: ["مدرسة", "نجمة", "حديقة", "نجاح", "دولة", "قوة", "سوق", "جبال", "علوم", "لوحة", "شمس"],
    lvl4: ["كمبيوتر", "مبرمج", "إدارة", "سعادة", "ابتكار", "تقنية", "فضاء", "اتصال", "تحديات", "تصميم", "فلسفة"]
};

/* ==================== 🛠 المتغيرات والثوابت ==================== */
const boardWidth = 400; const boardHeight = 600;
const platW = 110; const platH = 20; const playerH = 40; const playerW = 40;

let platforms = []; let pElts = {}; // Store Elements References mapped by unique id
let fallSpeed = 0; let score = 0; 
let player = { x:0, y:0, isJumping:false, el:null, platformRef: null, jumpToNode:null };
let activeTarget = null;
let gameActive = false; 
let platformCount = 0; // لضمان تخصيص id فريد لكل عنصر (Unique)

const boardEl = document.getElementById("game-board");
const playerEl = document.getElementById("player");
const scoreText = document.getElementById("scoreText");
const finalScoreText = document.getElementById("finalScore");
player.el = playerEl;

/* ==================== 📝 محرك ومولّد اللعبة ==================== */

// جلب كلمة مناسبة غير مستعملة أو تبدأ بنفس الحروف الحالية للمنع من تضارب الإختيار
function getValidWord() {
    let pool = (score > 60) ? dictionary.lvl4 : (score > 30) ? dictionary.lvl3 : (score > 10) ? dictionary.lvl2 : dictionary.lvl1;
    if(!pool) pool = dictionary.lvl2;

    let maxAttempts = 30; let attempt = 0;
    while(attempt < maxAttempts) {
        let picked = pool[Math.floor(Math.random() * pool.length)];
        let clash = platforms.some(p => p.word.startsWith(picked[0]));
        if(!clash) return picked; 
        attempt++;
    }
    // احتياط لكي لا يحدث تعليق اللعبة بسبب شروط الحرف المكرر 
    return pool[Math.floor(Math.random() * pool.length)] + (platformCount % 2 === 0 ? "" : " "); 
}

function createPlatform(yLoc, isCenter=false) {
    let xLoc = isCenter ? (boardWidth/2 - platW/2) : Math.random() * (boardWidth - platW);
    let id = "plat_" + (platformCount++);
    let newWord = getValidWord();
    
    // حفظ المنصة بمصفوفة كمنظومة فيزيائية (Data object)
    let pObj = { id: id, x: xLoc, y: yLoc, word: newWord.trim(), typedLength: 0, el: null, tEl: null, isDead: false };
    platforms.push(pObj);
    
    // حقن وتحديث منصة الـ HTML بصرياً (View Layer)
    let pDiv = document.createElement("div");
    pDiv.className = "platform";
    let textDiv = document.createElement("div");
    textDiv.className = "word-display";
    
    // بناء كلمة كاملة دون تغيير عند الإنشاء
    textDiv.innerHTML = renderHTMLWord(pObj); 
    
    pDiv.appendChild(textDiv);
    boardEl.appendChild(pDiv);
    pObj.el = pDiv; pObj.tEl = textDiv;
    pElts[id] = pObj;

    return pObj;
}

// عرض النصوص العربية باحترافية عن طريق تجزئة وتلوين (Spans) المنجز من الحروف.
function renderHTMLWord(p) {
    if (p.typedLength === 0) return p.word;
    let finishedPart = p.word.substring(0, p.typedLength);
    let remainPart = p.word.substring(p.typedLength);
    return `<span class="typed">${finishedPart}</span><span>${remainPart}</span>`;
}


function startGame() {
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");
    
    // مسح الدورة السابقة نهائياً إن وجدت وتصفير الجلسة.
    platforms.forEach(p => p.el.remove()); 
    platforms = []; activeTarget = null; platformCount = 0; score = 0; fallSpeed = 0.5;
    scoreText.innerText = "0";

    // زرع المنصات وتحديد مواقعها العمودية الإبتدائية
    let yMarker = boardHeight - 80;
    // البداية دائما من تحت والكلمات أطول كلما اتجهت المنصات لفوق الشاشة
    for (let i = 0; i < 7; i++) {
        let isFirstNode = (i === 0);
        let nObj = createPlatform(yMarker, isFirstNode); 
        if (isFirstNode) {
            playerEl.classList.remove("hidden");
            player.isJumping = false;
            player.platformRef = nObj; 
            player.x = nObj.x + (platW/2) - (playerW/2);
            player.y = nObj.y - playerH;
        }
        yMarker -= 90; // البعد بين السحبات/المنصات.
    }
    
    gameActive = true;
    requestAnimationFrame(gameLoop);
}


/* ==================== 🕹 ديناميكا فيزياء محرك اللعبة الرئيسي ==================== */

function gameLoop() {
    if (!gameActive) return;

    let highestYPlatformLoc = platforms[platforms.length - 1]?.y || 0; // Highest منصة بمعنى Y الاصغر رياضيا باللغة السالبة لأن المتجهين لأعلى سالبة نسبياً

    // إضافة الكاميرا الذكية التي تتغير لمركز النينجا بشكل ديناميكي إن صعد. 
    // اذا كان (Y) اقل من منتصف الطول يمر بتعديل الكاميرا بالدفع المتوالي 
    let centerCameraAdj = 0;
    let cameraTreshold = (boardHeight * 0.55); // عند تجاوز اللاعب المنتصف لأعلى.. 

    if (player.y < cameraTreshold) {
        centerCameraAdj = (cameraTreshold - player.y) * 0.15; // تأثير سلاسة التصحيح والانتقال Lerp camera Smooth 
    }
    
    // تفعيل الحركة الإعتيادية (الإنحدار التلقائي للمستويات - الجاذبية والسقوط الحر المستمر ببطء)
    let moveAmount = fallSpeed + centerCameraAdj;
    
    platforms.forEach(p => {
        p.y += moveAmount; // جميع المنصات تهبط لأسفل كمرور للزمن وكاميرا 
        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    });
    
    /* ميكانيكا تدمير المستوى وبناء من جديد اذا طار بعيدا واختفى لتحت. */
    let minimumVisibileIndex = -1;
    for(let i=0; i<platforms.length; i++){
        let pt = platforms[i];
        if(pt.y > boardHeight + 60 && !pt.isDead) { // إذا سقط للاسفل واختفى.. دمره.
            pt.el.remove();
            pt.isDead = true; 
            // تأكد انه لو وقع وكانت الكاميرا مركزه يفك التركيز من الهدف 🔴 
            if(activeTarget === pt) activeTarget = null;
        }
    }
    platforms = platforms.filter(x => !x.isDead);

    // إذا المنصات أصبحت في مسار مكشوف قليل في الأعلى أقم بالإنشاء وتمديدها عالياً
    let firstInQueue_yOffsetTopMostNode = platforms[platforms.length-1].y; 
    if(firstInQueue_yOffsetTopMostNode > 0){ 
        // استخرجت منصة قمة, نلحق ونحمي الصاعد 
        createPlatform(firstInQueue_yOffsetTopMostNode - 100); 
    }


    // /* == أنيميشن وإخراج حركة الاعب == */ 
    if(player.isJumping && player.jumpToNode) {
        // حركه بقانون خط سير السلاسة والأنمياشن التدريجية (Linear Interpolation) للقفز.
        let targetX_real = player.jumpToNode.x + (platW/2) - (playerW/2);
        let targetY_real = player.jumpToNode.y - playerH;
        
        let lx = (targetX_real - player.x) * 0.45; // أداء قفز سرعته جدا محفزة
        let ly = (targetY_real - player.y) * 0.45; 
        
        player.x += lx; 
        player.y += (ly + moveAmount); // خذ بعين الاعتبار إن المستوى بالأساس أيضاً يهبط أثتاء الأنيميشن!
        
        // التحقق من اصطدامه الفعلي بها لو قريبة: (End-Snap Snap lock and set ref platform completely active jump disabled)
        if(Math.abs(targetX_real - player.x) < 4 && Math.abs(targetY_real - player.y) < 4) {
            player.x = targetX_real;
            player.y = targetY_real;
            player.platformRef = player.jumpToNode;
            player.isJumping = false;
        }
    } 
    else if(player.platformRef) {
        // التصاق شديد لضمان الجاذبية والثقل الملاصق لو واقف ولم ينجز كتابات (معادل انشراح الجاذبية)
        player.x = player.platformRef.x + (platW/2) - (playerW/2);
        player.y = player.platformRef.y - playerH; 
    }
    
    playerEl.style.transform = `translate(${player.x}px, ${player.y}px)`;

    /* موت وخسارة البطل اذا تدحرج ووصل لأدنى حد الشاشة بسبب ضعف وتأخره أو سقوطه الفعلي */ 
    if(player.y > boardHeight + playerH) { 
       gameEndSystemRun();
       return; 
    }

    requestAnimationFrame(gameLoop);
}

function gameEndSystemRun() {
    gameActive = false;
    finalScoreText.innerText = score;
    document.getElementById("gameOverScreen").classList.remove("hidden");
}


/* ==================== ⌨ معالجة مدخلات اللغة وربط أحداث الكتابة بلوحة التحكم ==================== */

document.addEventListener("keydown", (e) => {
    if (!gameActive) return;
    let k = e.key;

    // استسلام والغاء تحديد (Cancel Selection System by ESP | BACKSPACE)
    if (k === 'Escape' || k === 'Backspace') {
        if(activeTarget){ 
           activeTarget.typedLength = 0; 
           activeTarget.tEl.innerHTML = renderHTMLWord(activeTarget);
           activeTarget = null;
        }
        return;
    }
    
    // أقصى حجم حروف هي واحد 
    if(k.length > 1) return;

    if (!activeTarget) { 
        // محرك ايجاد أعلى أقرب مناسب: البحث على أعلى الارتفاعات المرئية التي توجد فيها بدايات كلمة.
        // فقط يلقط كلمات من الكائنات غير الميتة ومنصة اعلى وأعمق مسافتا من البطل نفسه! 
        let options = platforms.filter(c => (c.y < (player.y + 40)) && c.word.startsWith(k));
        
        if (options.length > 0) {
            // نأخذ الموجه الأسفل/الاقرب إلينا. الرياضي للفرز.. Y كل ما كانت كبيرة فهي اقرب لأسفل (العين).
            options.sort((a,b) => b.y - a.y);
            activeTarget = options[0];
            activeTarget.typedLength = 1;
            activeTarget.tEl.innerHTML = renderHTMLWord(activeTarget);
            evaluateTarget(activeTarget); 
        } 
        
    } 
    else { 
        // المستخدم كان مثبت عين وأحكم حرف أخير ، يدخِل الباقي.. 
        // نتأكد هل فعلاً أضغط التالي الصحيح بالمحكم المطلوب ام حرف عشوائي متشتت 
        if (activeTarget.word[activeTarget.typedLength] === k) { 
             activeTarget.typedLength++;
             activeTarget.tEl.innerHTML = renderHTMLWord(activeTarget);
             evaluateTarget(activeTarget);
        }
    }

});

function evaluateTarget(nTargetE) {
    if(nTargetE.typedLength === nTargetE.word.length) { 
        // إذا قام بتخليص وانجاز السطوح من جميع الاحرف المطلوبه .. تمت ! ✅🔥
        player.jumpToNode = nTargetE;
        player.isJumping = true; 
        player.platformRef = null; 
        
        activeTarget = null; 
        score += nTargetE.word.length * 10;
        fallSpeed += 0.05; // اجعل السرعة والمستوى يعزف أصعب ويحاسبه 💥
        scoreText.innerText = score;
    }
}
</script>
</body>
</html>
